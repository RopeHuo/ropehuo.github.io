name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [qagent-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 聚合 qagent 的静态页面到 dist/qagent/
      # qagent 为 private 仓库，用 QAGENT_REPO_TOKEN 读取（secret 名沿用历史命名）
      - name: Checkout qagent
        id: qagent
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: RopeHuo/qagent
          ref: main
          token: ${{ secrets.QAGENT_PROOF_TOKEN }}
          path: qagent-src

      - name: Inject qagent page
        if: always()
        run: |
          mkdir -p dist/qagent
          if [ -f qagent-src/index.html ] && [ -f qagent-src/styles.css ]; then
            cp qagent-src/index.html qagent-src/styles.css dist/qagent/
            if [ -f qagent-src/.nojekyll ]; then
              cp qagent-src/.nojekyll dist/qagent/
            fi
          else
            echo "::warning::qagent checkout unavailable; publishing fallback page"
            cat > dist/qagent/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="color-scheme" content="dark" />
              <title>QAgent — 暂时不可用</title>
              <style>
                body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f14; color: #e6edf3; font: 16px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
                main { max-width: 38rem; padding: 2rem; }
                h1 { font-size: 1.5rem; margin: 0 0 1rem; }
                p { color: #8b949e; margin: 0; }
                a { color: #58a6ff; }
              </style>
            </head>
            <body>
              <main>
                <h1>QAgent</h1>
                <p>页面暂时不可用，主站其他内容不受影响。</p>
                <p><a href="/">返回 RopeHuo</a></p>
              </main>
            </body>
          </html>
          HTML
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
