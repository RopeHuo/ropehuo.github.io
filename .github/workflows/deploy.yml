name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [qagent-proof-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 聚合 qagent-proof 的静态页面到 dist/qagent-proof/
      # qagent-proof 已改为 private，需用有读取权限的 PAT
      - name: Checkout qagent-proof
        uses: actions/checkout@v4
        with:
          repository: RopeHuo/qagent-proof
          ref: main
          token: ${{ secrets.QAGENT_PROOF_TOKEN }}
          path: qagent-proof-src

      - name: Inject qagent-proof page
        run: |
          mkdir -p dist/qagent-proof
          cp qagent-proof-src/index.html qagent-proof-src/styles.css qagent-proof-src/.nojekyll dist/qagent-proof/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
